<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>捏捏食物小动物</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#5a4038;background:#fff7f2;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh}
@supports(height:100dvh){#app{height:100dvh}}
#stage{position:relative;flex:0 0 52%;background:radial-gradient(120% 90% at 50% 30%,#fffaf3 0%,#ffe9e4 55%,#f7d9e6 100%);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;pointer-events:none}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.5px;white-space:nowrap;color:#e0607e;text-shadow:0 2px 0 #fff}
header .sp{flex:1}
.ib{pointer-events:auto;border:0;background:#ffffffd9;border-radius:14px;min-width:40px;height:40px;padding:0 10px;font-size:18px;color:#5a4038;box-shadow:0 2px 8px #e8b4c033;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.ib small{font-size:12px;font-weight:700}
.ib:disabled{opacity:.35}
#bottomBtns{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
#panelWrap{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #e8b4c033;margin-top:-16px;position:relative;z-index:2}
#tabs{display:flex;gap:4px;padding:10px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;border:0;background:#fff3f0;color:#a07a6e;border-radius:12px;padding:9px 9px;font-size:14px;font-weight:700;cursor:pointer}
#tabs button.on{background:#ff8fa3;color:#fff}
#panel{flex:1;overflow-y:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
section{margin:10px 0 14px}
h3{margin:0 0 8px;font-size:13px;color:#b08a7e;font-weight:700;display:flex;align-items:center;gap:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.chips.big{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.chip{border:2px solid #f6e6e0;background:#fffaf8;border-radius:14px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#7a5a50;cursor:pointer}
.chip .ic{font-size:20px;line-height:24px;height:24px}
.chips.big .ic{font-size:28px;line-height:34px;height:34px}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lib{background:#fffaf8;border:2px solid #f6e6e0;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#7a5a50;position:relative}.lib img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#fff 0 25%,#f7eef0 0 50%) 0 0/14px 14px;border-radius:10px;cursor:pointer}.lib b{position:absolute;top:8px;left:8px;background:#ff8fa3;color:#fff;border-radius:6px;padding:0 5px;font-size:10px}.lib span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb{display:flex;gap:4px}.lb button{border:0;background:#ffe3ea;color:#d0506e;border-radius:8px;padding:3px 7px;font-size:11px}
.chip.on{border-color:#ff8fa3;background:#fff0f3;color:#e0607e;font-weight:700}
.row{display:flex;gap:8px}.row.wrap{flex-wrap:wrap}
.tog{border:2px solid #f6e6e0;background:#fffaf8;border-radius:999px;padding:7px 14px;font-size:13px;color:#7a5a50;cursor:pointer}
.tog.on{border-color:#ff8fa3;background:#ff8fa3;color:#fff;font-weight:700}
.act{flex:1;border:0;background:#ffe4ea;color:#c84b6a;border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;min-width:140px}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px;color:#7a5a50}
.sl span{width:40px}
.sl input{flex:1;accent-color:#ff8fa3}
.crow{margin:8px 0 12px}
.crow input[type=color]{width:26px;height:22px;border:0;padding:0;background:none;margin-left:auto}
.sw{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.sw button{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #eadad4;cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px #ff8fa3}
.hint{font-size:12px;color:#b8a09a;margin:6px 2px}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.born{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:6;pointer-events:none;image-rendering:pixelated;animation:bornIn .5s steps(5) .1s forwards,bornBob .8s steps(2) .7s infinite alternate}
.born.out{animation:bornOut .45s ease-in forwards}
@keyframes bornIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bornBob{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,calc(-50% - 4px))}}
@keyframes bornOut{to{opacity:0;transform:translate(-50%,-80%) scale(.8)}}
#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);box-sizing:border-box;width:max-content;max-width:min(78vw,320px);padding:12px 18px;border-radius:14px;background-color:#b9773f;color:#fff;text-shadow:0 1px 0 #5a2f12,1px 0 0 #5a2f12,-1px 0 0 #5a2f12,0 -1px 0 #5a2f12,0 2px 3px #3a1d0a;font-weight:700;font-size:13px;line-height:1.55;text-align:center;letter-spacing:.3px;box-shadow:0 4px 0 #6e3c18,0 8px 18px #3a241840;border:2px solid #7e4520;opacity:0;transition:.25s;pointer-events:none;z-index:9;word-break:break-all;white-space:pre-line}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.fd{border:2px solid #f6e6e0;background:#fffaf8;border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#7a5a50;cursor:pointer}
.fd i{width:30px;height:30px;border-radius:8px;background-size:cover;image-rendering:pixelated;display:block;font-style:normal;line-height:30px;font-size:18px}
.fd.on{border-color:#ff8fa3;background:#fff0f3;color:#e0607e;font-weight:700}
#prev{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20}
#prev.show{display:flex}
#prev img{max-width:86vw;max-height:70vh;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px}
#prev p{color:#fff;font-size:13px;margin:0}
#prev button{border:0;border-radius:999px;padding:8px 22px;background:#fff;color:#c84b6a;font-weight:700}
@media (min-width:820px){
 #app{flex-direction:row}
 #stage{flex:1 1 auto}
 #panelWrap{flex:0 0 380px;margin:0;border-radius:0;box-shadow:-6px 0 24px #e8b4c033}
 header h1{font-size:22px}
}

  <div id="bottomBtns">

 <div id="panelWrap"><div id="tabs"></div><div id="panel"></div></div>
